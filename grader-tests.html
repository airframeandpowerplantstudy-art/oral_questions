<!doctype html><meta charset="utf-8"><title>FAA Grader v2 Tests</title><script src="banks.js"></script><script src="grader-v2.js"></script><pre id="out"></pre><script>const tests=[];function find(s){for(const b of ORAL_BANKS)for(const q of b.questions)if(q.question.toLowerCase().includes(s))return q}function t(name,q,a,expected){let g=FAA_GRADER.grade(q,a);tests.push({name,result:g.level,expected,ok:g.level===expected,recognized:g.concepts.filter(x=>x.met).map(x=>x.label)})}let rotor=find('attaching turbine engine rotor blades');t('Dovetail speech answer',rotor,'dove tail fir tree and bulb','pass');let kinetic=find('define kinetic energy');if(kinetic){t('Kinetic repeat only',kinetic,'kinetic energy','fail');t('Kinetic meaning',kinetic,'energy of motion','pass')}let lever=find('parts of a lever');if(lever)t('Lever concise',lever,'bar and pivot','pass');document.getElementById('out').textContent=JSON.stringify(tests,null,2);</script>
